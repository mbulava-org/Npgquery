name: Build & Test Npgquery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  standard-ci: 
    uses: ./.github/workflows/standard-dotnet-library-ci.yml 
    secrets: inherit
    with:
      dotnet_version: '9.0.x'
      semantic_version: '1.0.0.0'
      push_output: false
      push_branch: true


  build-native:
    if: 1 == 0
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Linux/macOS build
      - name: Build libpg_query (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          git clone -b 17-latest https://github.com/pganalyze/libpg_query
          cd libpg_query
          make
          mkdir -p ../runtimes/${{ matrix.os }}/native
          cp libpg_query.* ../runtimes/${{ matrix.os }}/native/

      # Windows build
      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build pg_query.lib
        if: matrix.os == 'windows-latest'
        run: |
          git clone -b 17-latest https://github.com/pganalyze/libpg_query
          cd libpg_query
          nmake /F Makefile.msvc

      - name: Build wrapper DLL
        if: matrix.os == 'windows-latest'
        run: |
          msbuild wrapper/pgquery_wrapper.vcxproj /p:Configuration=Release /p:Platform=x64
          mkdir runtimes\win-x64\native
          copy x64\Release\pgquery_wrapper.dll runtimes\win-x64\native\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: runtimes/